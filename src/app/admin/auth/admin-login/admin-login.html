<div class="login-page">
    <div class="login-background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="background-grid"></div>
    </div>

    <main class="login-container">
        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">E</div>
                <span class="brand-name">E-Commerce<span>.</span></span>
            </div>

            <div class="login-heading">
                <div class="admin-badge">
                    <span class="status-dot"></span>
                    ADMIN PORTAL
                </div>

                <h1>Welcome back</h1>
                <p>Sign in to access your admin dashboard.</p>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="m3 7 9 6 9-6"></path>
                        </svg>

                        <input id="email" type="email" name="email" [(ngModel)]="email" #emailField="ngModel"
                            placeholder="admin@example.com" autocomplete="username" required email />
                    </div>

                    @if (emailField.invalid && emailField.touched) {
                    <small class="field-error">
                        Please enter a valid email address.
                    </small>
                    }
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>

                        <button type="button" class="forgot-password" (click)="goToForgotPassword()">
                            Forgot password?
                        </button>
                    </div>

                    <div class="input-wrapper">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                        </svg>

                        <input id="password" [type]="showPassword ? 'text' : 'password'" name="password"
                            [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password"
                            required />

                        <button class="password-toggle" type="button" (click)="showPassword = !showPassword"
                            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                            @if (showPassword) {
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 8.5 4.5 9.5 7-.4 1-1.2 2.1-2.3 3.1"></path>
                                <path d="M6.2 6.2C3.9 7.6 2.7 9.6 2.5 12c.8 2 3.8 7 9.5 7 1.2 0 2.3-.2 3.3-.7"></path>
                            </svg>
                            } @else {
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            }
                        </button>
                    </div>
                </div>

                @if (errorMessage) {
                <div class="error-message" role="alert">
                    <span>!</span>
                    {{ errorMessage }}
                </div>
                }

                <button class="login-button" type="submit" [disabled]="isLoading || loginForm.invalid">
                    @if (isLoading) {
                    <span class="loader"></span>
                    Signing in...
                    } @else {
                    Sign in to dashboard
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6"></path>
                    </svg>
                    }
                </button>
            </form>

            <div class="login-footer">
                <span class="secure-icon">♢</span>
                Secure admin access
            </div>
        </section>

        <footer class="page-footer">
            <span>© 2026 E-Commerce</span>
            <span>Admin Management Portal</span>
        </footer>
    </main>
</div>
